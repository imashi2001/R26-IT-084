# Railway backend service — Dashboard → Settings → Build must match backend/Dockerfile:
#   Root Directory  = .  (repo root)
#   Dockerfile Path = backend/Dockerfile
#
# If Root Directory is set to "backend" instead, change Dockerfile COPY lines to
# package.json / . (see git history 32c5110) — do not use COPY backend/ paths.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

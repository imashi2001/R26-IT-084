# Run the Litter Severity API (YOLO + LSI) with Docker Compose.
# From repository ROOT (R26-IT-084):
#   docker compose -f docker-compose.litter.yml up --build
#
# Requires Docker Desktop (or Docker Engine) running on Windows.

services:
  litter-severity-api:
    build:
      context: ./services/litter-severity-api
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    environment:
      PORT: "8000"

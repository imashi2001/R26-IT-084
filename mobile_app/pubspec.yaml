name: visionwaste
description: VisionWaste – bin-level detection, nearest bin finder & municipal staff dashboard.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  go_router: ^13.2.4
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    # Optional real photos (see assets/images/README.md). Missing files fall
    # back to the built-in animated illustrations.
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
